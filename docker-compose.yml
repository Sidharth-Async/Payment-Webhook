services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: webhook_dev
      POSTGRES_PASSWORD: pass123
      POSTGRES_DB: webhooks
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U webhook_dev -d webhooks" ]
      interval: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://webhook_dev:pass123@db:5432/webhooks
      WEBHOOK_SECRET: web123
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy